[project]
name = "aviary"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dawid", email = "dawid.kow11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.2",
    "langgraph>=1.2.10",
    "lxml>=6.1.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "structlog>=26.1.0",
    "typer>=0.27.1",
]

[project.scripts]
aviary = "aviary:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-recording>=0.13.4",
    "ruff>=0.16.2",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF", "TCH", "PTH"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "fastembed.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: wymaga uruchomionego Qdranta"]
